        }

            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover {
            background-color: #f0f8ff;
        }
        .correct {
            background-color: #d4edda;
            border-color: #c3e6cb;

        }

            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

            margin-top: 15px;
            padding: 15px;
            background-color: #e7f3ff;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            font-size: 15px;
            color: #2c3e50;
            display: none;
        }
        .explanation .correct-answer {
            font-weight: bold;
            color: #27ae60;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

            background-color: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
            color: #856404;
            border: 1px solid #ffeeba;
        }

            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            margin: 15px 0;
            overflow: hidden;
        }

            height: 100%;
            background-color: #28a745;
            transition: width 0.3s;
        }

            text-align: center;
            padding: 30px;
            font-size: 20px;
            color: #28a745;

            justify-content: space-between;

</head>

        </div>

        <div id="question-container"></div>
        
        <div class="navigation">
            <button id="prev-set" disabled>上一组</button>
            <button id="next-set" disabled>下一组</button>
        </div>
        
        <div class="controls">
            <button id="review-wrong" style="display: none;">重做错题</button>
            <button id="reset">重新开始（随机打乱）</button>
        </div>
    </div>

            reviewWrongBtn.style.display = 'none';
            totalSetsEl.textContent = state.totalSets;
        }

        // 获取当前题目集的题目（根据打乱顺序）
        function getCurrentQuestions() {
            if (state.isReviewMode) {
                // 错题模式下，直接从错题列表中获取（保持错题原顺序，也可以打乱）
                return state.wrongQuestions.slice(0, 3);
            }
            
            const startIndex = state.currentSet * 3;
            const indices = state.shuffledIndices.slice(startIndex, startIndex + 3);
            return indices.map(i => originalQuestionBank[i]);
        }

        // 渲染题目集
        function renderQuestionSet() {
            questionContainer.innerHTML = '';
            const questions = getCurrentQuestions();
            
            if (questions.length === 0) {
                questionContainer.innerHTML = '<div class="completion-message"><p>所有题目已完成！</p></div>';
                nextSetBtn.disabled = true;
                prevSetBtn.disabled = true;
                
                if (state.wrongQuestions.length > 0) {
                    reviewWrongBtn.style.display = 'block';
                }
                return;
            }
            
            questions.forEach((q, index) => {
                // 获取该题目在原始题库中的索引（用于记录用户答案）
                let originalIndex;
                if (state.isReviewMode) {
                    originalIndex = originalQuestionBank.indexOf(q);
                } else {
                    originalIndex = state.shuffledIndices[state.currentSet * 3 + index];
                }
                
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-container';
                
                const questionText = document.createElement('div');
                questionText.className = 'question';
                questionText.innerHTML = `<span>${index + 1}.</span> ${q.question}`;
                
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';
                
                q.options.forEach((option, optIndex) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    optionDiv.textContent = `${String.fromCharCode(65 + optIndex)}. ${option}`;
                    optionDiv.dataset.answer = String.fromCharCode(65 + optIndex);
                    optionDiv.dataset.originalIndex = originalIndex;
                    
                    // 如果已经回答过，显示状态
                    if (state.userAnswers[originalIndex] !== null) {
                        const userAnswer = state.userAnswers[originalIndex];
                        if (userAnswer === q.answer) {
                            optionDiv.classList.add('correct');
                        } else if (userAnswer === String.fromCharCode(65 + optIndex)) {
                            optionDiv.classList.add('incorrect');
                        }
                        
                        if (String.fromCharCode(65 + optIndex) === q.answer) {
                            optionDiv.classList.add('correct');
                        }
                        
                        optionDiv.style.pointerEvents = 'none';
                    } else {
                        optionDiv.addEventListener('click', () => selectAnswer(q, optionDiv, originalIndex));
                    }
                    
                    optionsDiv.appendChild(optionDiv);
                });
                
                // 创建解析区域
                const explanationDiv = document.createElement('div');
                explanationDiv.className = 'explanation';
                explanationDiv.id = `explanation-${originalIndex}`;
                if (state.userAnswers[originalIndex] !== null) {
                    // 如果已经回答过，显示解析
                    explanationDiv.innerHTML = `<span class="correct-answer">正确答案：${q.answer}</span><br>${q.explanation}`;
                    explanationDiv.style.display = 'block';
                }
                
                questionDiv.appendChild(questionText);
                questionDiv.appendChild(optionsDiv);
                questionDiv.appendChild(explanationDiv);
                questionContainer.appendChild(questionDiv);
            });
            
            updateNavigationButtons();
        }

        // 选择答案
        function selectAnswer(question, selectedOption, originalIndex) {
            const options = selectedOption.parentElement.children;
            
            // 禁用所有选项点击
            for (let opt of options) {
                opt.style.pointerEvents = 'none';
            }
            
            // 记录用户答案
            state.userAnswers[originalIndex] = selectedOption.dataset.answer;
            
            // 检查答案
            if (selectedOption.dataset.answer === question.answer) {
                selectedOption.classList.add('correct');
                state.correct++;
                
                // 如果是错题模式且答对了，从错题列表中移除
                if (state.isReviewMode) {
                    const index = state.wrongQuestions.indexOf(question);
                    if (index > -1) {
                        state.wrongQuestions.splice(index, 1);
                    }
                }
            } else {
                selectedOption.classList.add('incorrect');
                state.incorrect++;
                
                // 标记正确答案
                for (let opt of options) {
                    if (opt.dataset.answer === question.answer) {
                        opt.classList.add('correct');
                    }
                }
                
                // 如果此题不在错题列表中，则添加
                if (!state.wrongQuestions.includes(question)) {
                    state.wrongQuestions.push(question);
                }
            }
            
            // 显示解析
            const explanationDiv = document.getElementById(`explanation-${originalIndex}`);
            if (explanationDiv) {
                explanationDiv.innerHTML = `<span class="correct-answer">正确答案：${question.answer}</span><br>${question.explanation}`;
                explanationDiv.style.display = 'block';
            }
            
            state.answered++;
            updateStats();
            updateNavigationButtons();
        }

        // 更新统计信息
        function updateStats() {
            answeredEl.textContent = state.answered;
            remainingEl.textContent = state.total - state.answered;
            correctEl.textContent = state.correct;
            incorrectEl.textContent = state.incorrect;
            currentSetEl.textContent = state.currentSet + 1;
            
            // 更新进度条
            const progressPercentage = (state.answered / state.total) * 100;
            progressBar.style.width = `${progressPercentage}%`;
        }

        // 更新导航按钮状态
        function updateNavigationButtons() {
            prevSetBtn.disabled = state.currentSet === 0;
            
            if (state.isReviewMode) {
                // 错题模式下，只要还有下一组就可以前进
                nextSetBtn.disabled = state.currentSet >= Math.ceil(state.wrongQuestions.length / 3) - 1;
            } else {
                // 正常模式下，检查当前组是否全部答完
                const startIndex = state.currentSet * 3;
                const indices = state.shuffledIndices.slice(startIndex, startIndex + 3);
                let allAnswered = true;
                for (let idx of indices) {
                    if (state.userAnswers[idx] === null) {
                        allAnswered = false;
                        break;
                    }
                }
                nextSetBtn.disabled = !allAnswered || state.currentSet >= state.totalSets - 1;
            }
        }

        // 下一组题目处理
        function nextSetHandler() {
            if (state.isReviewMode) {
                if (state.currentSet < Math.ceil(state.wrongQuestions.length / 3) - 1) {
                    state.currentSet++;
                    renderQuestionSet();
                }
            } else {
                if (state.currentSet < state.totalSets - 1) {
                    state.currentSet++;
                    renderQuestionSet();
                }
            }
        }

        // 上一组题目处理
        function prevSetHandler() {
            if (state.currentSet > 0) {
                state.currentSet--;
                renderQuestionSet();
            }
        }

        // 重做错题处理
        function reviewWrongHandler() {
            if (state.wrongQuestions.length === 0) {
                alert('没有错题需要重做！');
                return;
            }
            
            state.isReviewMode = true;
            state.currentSet = 0;
            reviewModeAlert.style.display = 'block';
            reviewWrongBtn.style.display = 'none';
            totalSetsEl.textContent = Math.ceil(state.wrongQuestions.length / 3);
            
            renderQuestionSet();
        }

        // 重置处理（重新开始，打乱顺序）
        function resetHandler() {
            resetState();
            renderQuestionSet();
        }

        // 初始化应用
        function init() {
            totalQuestionsEl.textContent = originalQuestionBank.length;
            totalSetsEl.textContent = Math.ceil(originalQuestionBank.length / 3);
            resetState(); // 生成随机顺序
            renderQuestionSet();
            
            // 事件监听
            nextSetBtn.addEventListener('click', nextSetHandler);
            prevSetBtn.addEventListener('click', prevSetHandler);
            reviewWrongBtn.addEventListener('click', reviewWrongHandler);
            resetBtn.addEventListener('click', resetHandler);
        }

        // 启动
        window.onload = init;
    </script>
</body>
</html>
