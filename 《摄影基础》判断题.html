        }

        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;

            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-item {
            margin: 5px 10px;
            font-size: 16px;
        }
        .highlight {
            font-weight: bold;
            color: #2c3e50;
        }
        .question {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 15px;
        }
        .options {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .option {
            padding: 10px 20px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .option:hover:not(.disabled-option) {
            background: #f0f5ff;
            border-color: #a0c1ff;
        }
        .correct {
            background-color: #e6f7e6;
            border-color: #4caf50;
            color: #2e7d32;
        }
        .incorrect {
            background-color: #ffe6e6;
            border-color: #f44336;
            color: #c62828;
        }
        .disabled-option {
            pointer-events: none;
            opacity: 0.8;
        }
        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background-color: #f0f4f8;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            font-size: 15px;
            line-height: 1.5;
            display: none;
        }
        .explanation-box.show {
            display: block;
        }
        .explanation-title {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .prev-btn {
            background: #6c757d;
            color: white;
        }
        .prev-btn:hover:not(:disabled) {
            background: #5a6268;
        }
        .next-btn {
            background: #007bff;
            color: white;
        }
        .next-btn:hover:not(:disabled) {
            background: #0069d9;
        }
        .shuffle-btn {
            background: #ffc107;
            color: #212529;
        }

            background: #e0a800;
        }
        .restart-btn {
            background: #28a745;
            color: white;
        }

        }

            color: white;
        }

            background: #c82333;
        }

            opacity: 0.5;

            display: none;
        }

            text-align: center;
            margin: 15px 0;
            font-size: 18px;
            color: #6c757d;

            background: #17a2b8;

        const QUESTIONS_PER_SET = 5;  // 每组5道题

        // ---------- 状态变量 ----------
        // 正常顺序（原始索引数组）
        let normalOrder = Array.from({ length: questionBank.length }, (_, i) => i);
        // 复习模式顺序（错题原始索引）
        let reviewOrder = [];
        let isReviewMode = false;

        // 用户答案记录（原始索引 -> true/false/null）
        let userAnswers = new Array(questionBank.length).fill(null);

        let currentSetIndex = 0;

        // DOM 元素
        const questionContainer = document.getElementById('question-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const restartBtn = document.getElementById('restart-btn');
        const exitReviewBtn = document.getElementById('exit-review-btn');
        const currentSetSpan = document.getElementById('current-set');
        const totalSetsSpan = document.getElementById('total-sets');
        const totalQuestionsSpan = document.getElementById('total-questions');
        const answeredSpan = document.getElementById('answered');
        const remainingSpan = document.getElementById('remaining');
        const correctSpan = document.getElementById('correct');
        const incorrectSpan = document.getElementById('incorrect');
        const modeText = document.getElementById('mode-text');

        // ---------- 初始化 ----------
        function init() {
            totalQuestionsSpan.textContent = questionBank.length;
            updateTotalSets();
            updateStats();
            showCurrentSet();
            attachEvents();
        }

        // 更新总组数（根据当前顺序长度）
        function updateTotalSets() {
            const currentOrder = isReviewMode ? reviewOrder : normalOrder;
            const totalSets = Math.ceil(currentOrder.length / QUESTIONS_PER_SET);
            totalSetsSpan.textContent = totalSets;
        }

        // 更新统计
        function updateStats() {
            let answered = 0;
            let correct = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans !== null) {
                    answered++;
                    if (ans === questionBank[idx].answer) correct++;
                }
            });
            answeredSpan.textContent = answered;
            remainingSpan.textContent = questionBank.length - answered;
            correctSpan.textContent = correct;
            incorrectSpan.textContent = answered - correct;
        }

        // 显示当前组的题目
        function showCurrentSet() {
            questionContainer.innerHTML = '';
            const currentOrder = isReviewMode ? reviewOrder : normalOrder;
            const totalSets = Math.ceil(currentOrder.length / QUESTIONS_PER_SET);
            // 边界保护
            if (currentSetIndex >= totalSets) currentSetIndex = Math.max(0, totalSets - 1);
            currentSetSpan.textContent = currentSetIndex + 1;

            const startIdx = currentSetIndex * QUESTIONS_PER_SET;
            const endIdx = Math.min(startIdx + QUESTIONS_PER_SET, currentOrder.length);

            for (let i = startIdx; i < endIdx; i++) {
                const originalIndex = currentOrder[i];
                const question = questionBank[originalIndex];
                // 显示序号：基于当前组内的位置（从1开始）
                const displayNumber = i - startIdx + 1;
                const questionElement = createQuestionElement(question, originalIndex, displayNumber);
                questionContainer.appendChild(questionElement);
            }

            // 更新导航按钮
            prevBtn.disabled = currentSetIndex === 0;
            nextBtn.disabled = currentSetIndex === totalSets - 1;

            // 模式相关UI
            if (isReviewMode) {
                shuffleBtn.disabled = true;
                restartBtn.disabled = true;
                exitReviewBtn.classList.remove('hidden');
                modeText.textContent = '复习错题';
            } else {
                shuffleBtn.disabled = false;
                restartBtn.disabled = false;
                exitReviewBtn.classList.add('hidden');
                modeText.textContent = '正常练习';
            }
        }

        // 创建题目DOM，参数：题目对象、原始索引、显示序号（1-based）
        function createQuestionElement(question, originalIndex, displayNumber) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            questionDiv.dataset.originalIndex = originalIndex; // 方便查找

            const questionText = document.createElement('div');
            questionText.className = 'question-text';
            questionText.textContent = `${displayNumber}. ${question.text}`; // 使用显示序号
            questionDiv.appendChild(questionText);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            const trueOption = document.createElement('div');
            trueOption.className = 'option';
            trueOption.textContent = '正确';
            trueOption.dataset.value = true;

            const falseOption = document.createElement('div');
            falseOption.className = 'option';
            falseOption.textContent = '错误';
            falseOption.dataset.value = false;

            optionsDiv.appendChild(trueOption);
            optionsDiv.appendChild(falseOption);
            questionDiv.appendChild(optionsDiv);

            // 解析框
            const explanationBox = document.createElement('div');
            explanationBox.className = 'explanation-box';
            explanationBox.innerHTML = `
                <div class="explanation-title">📘 解析</div>
                <div class="explanation-content"></div>
            `;
            questionDiv.appendChild(explanationBox);

            // 如果已经答过，显示答案状态和解析
            const userAns = userAnswers[originalIndex];
            if (userAns !== null) {
                // 禁用点击
                trueOption.classList.add('disabled-option');
                falseOption.classList.add('disabled-option');
                // 显示颜色
                const isCorrect = userAns === question.answer;
                if (userAns === true) {
                    trueOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                    if (!isCorrect) falseOption.classList.add('correct');
                } else {
                    falseOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                    if (!isCorrect) trueOption.classList.add('correct');
                }
                // 显示解析
                showExplanation(explanationBox, question, userAns);
            } else {
                // 未答，添加点击事件
                trueOption.addEventListener('click', () => selectOption(question, true, originalIndex, questionDiv));
                falseOption.addEventListener('click', () => selectOption(question, false, originalIndex, questionDiv));
            }

            return questionDiv;
        }

        // 选择答案
        function selectOption(question, selectedValue, originalIndex, questionDiv) {
            // 记录答案
            userAnswers[originalIndex] = selectedValue;
            updateStats();

            // 获取该题目DOM中的选项和解析框
            const options = questionDiv.querySelectorAll('.option');
            const trueOption = options[0];
            const falseOption = options[1];
            const explanationBox = questionDiv.querySelector('.explanation-box');

            // 禁用选项点击
            trueOption.classList.add('disabled-option');
            falseOption.classList.add('disabled-option');
            // 移除原有的事件监听（简单方式：替换为克隆，但这里不再需要，因为已禁用点击）

            // 显示正确/错误颜色
            const isCorrect = selectedValue === question.answer;
            if (selectedValue === true) {
                trueOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                if (!isCorrect) falseOption.classList.add('correct');
            } else {
                falseOption.classList.add(isCorrect ? 'correct' : 'incorrect');
                if (!isCorrect) trueOption.classList.add('correct');
            }

            // 显示解析
            showExplanation(explanationBox, question, selectedValue);
        }

        // 显示解析内容
        function showExplanation(explanationBox, question, selectedValue) {
            const contentDiv = explanationBox.querySelector('.explanation-content');
            const isCorrect = selectedValue === question.answer;
            const correctAnswerText = question.answer ? '正确' : '错误';
            const userAnswerText = selectedValue ? '正确' : '错误';
            const resultText = isCorrect ? '✅ 回答正确' : '❌ 回答错误';
            contentDiv.innerHTML = `
                <p><strong>${resultText}</strong></p>
                <p><strong>正确答案：</strong>${correctAnswerText}</p>
                <p><strong>你的选择：</strong>${userAnswerText}</p>
                <p>${question.explanation}</p>
            `;
            explanationBox.classList.add('show');
        }

        // ---------- 导航 ----------
        function goToPrevSet() {
            if (currentSetIndex > 0) {
                currentSetIndex--;
                showCurrentSet();
            }
        }

        function goToNextSet() {
            const currentOrder = isReviewMode ? reviewOrder : normalOrder;
            const totalSets = Math.ceil(currentOrder.length / QUESTIONS_PER_SET);
            if (currentSetIndex < totalSets - 1) {
                currentSetIndex++;
                showCurrentSet();
            }
        }

        // ---------- 随机打乱（仅正常模式） ----------
        function shuffleNormalOrder() {
            if (isReviewMode) return;
            // Fisher-Yates 洗牌
            for (let i = normalOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [normalOrder[i], normalOrder[j]] = [normalOrder[j], normalOrder[i]];
            }
            // 重置答题记录
            userAnswers.fill(null);
            currentSetIndex = 0;
            updateStats();
            updateTotalSets();
            showCurrentSet();
        }

        // ---------- 错题重做（进入复习模式） ----------
        function startReview() {
            const wrongIndices = [];
            userAnswers.forEach((ans, idx) => {
                if (ans !== null && ans !== questionBank[idx].answer) {
                    wrongIndices.push(idx);
                }
            });
            if (wrongIndices.length === 0) {
                alert('恭喜！当前没有错题。');
                return;
            }

            reviewOrder = wrongIndices;
            isReviewMode = true;
            currentSetIndex = 0;
            // 重置答题记录，准备重新练习错题
            userAnswers.fill(null);
            updateStats();
            updateTotalSets();
            showCurrentSet();
        }

        // ---------- 退出复习模式 ----------
        function exitReview() {
            isReviewMode = false;
            // 返回正常模式时，可保留之前的答题记录，也可清空。这里选择保留正常模式的答题记录（不清空）
            // 但为了统一，如果不清空，之前答过的题仍然有颜色。这符合预期。
            // 注意：退出复习时，应该恢复到正常顺序，但用户可能之前打乱过，所以 normalOrder 保持不变。
            currentSetIndex = 0;
            updateTotalSets();
            showCurrentSet();
        }

        // ---------- 事件绑定 ----------
        function attachEvents() {
            prevBtn.addEventListener('click', goToPrevSet);
            nextBtn.addEventListener('click', goToNextSet);
            shuffleBtn.addEventListener('click', shuffleNormalOrder);
            restartBtn.addEventListener('click', startReview);
            exitReviewBtn.addEventListener('click', exitReview);
        }

        // 启动
        init();
    </script>
